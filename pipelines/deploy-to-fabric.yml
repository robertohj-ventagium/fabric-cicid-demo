trigger:
  branches:
    include:
    - preprod
    - prod
  paths:
    include:
    - fabric/**

parameters:
- name: items_in_scope
  displayName: Enter Fabric items to be deployed
  type: string
  default: '["Notebook","DataPipeline","Lakehouse","SemanticModel","Report", "VariableLibrary"]'

variables:
  - name: target_env
    value: ${{ replace(variables['Build.SourceBranch'], 'refs/heads/', '') }}
  - group: fabric_cicd_group_non_sensitive
  # The fabric_cicd_group_non_sensitive variable group contains the workspace variables whose name follows the naming convention "[branch]WorkspaceName".
  # E.g., devWorkspaceName, preprodWorkspaceName, prodWorkspaceName, etc.
  # This is MANDATORY as this naming convention is expected in the python script
  # It also contains the gitFolder to be referenced in the python script.
  - group: fabric_cicd_group_sensitive
  # The fabric_cicd_group_sensitive contains sensitive values (like secrets);
  # Linking this variable group to Azure Key Vault is recommended. 
  # This variable group contains the Service Principal data: tenant id, client id and client secret
  # Alternative: don't link to Azure Key Vault but treat values as secrets
stages:
  - stage: DeployToFabric
    displayName: "Deploy to Fabric Workspace"
    jobs:
      - deployment: Deployment
        displayName: "Deploy Resources"
        environment: $(target_env)
        pool:
          name: Azure Pipelines
        strategy:
          runOnce:
            deploy:
             steps:
              # Use Python Version 3.12
              - checkout: self
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.12'
                  addToPath: true
                displayName: "Set up Python Environment"
              # Install Dependencies
              - script: |
                  python -m pip install --upgrade pip
                  pip install fabric-cicd 
                displayName: "Install Fabric CICD Library"
              - task: PythonScript@0
                inputs:
                  scriptSource: 'filePath'
                  scriptPath: 'scripts/deploy-to-fabric.py'
                  arguments: '--aztenantid $(aztenantid) --azclientid $(azclientid) --azspsecret $(azspnsecret) --items_in_scope ${{ parameters.items_in_scope }} --target_env $(target_env)'
                  #failOnStderr: true 
                displayName: 'Run deployment using fabric-cicd'